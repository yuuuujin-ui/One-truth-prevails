<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>코난 정주행 수첩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#16336e;        /* 코난 블레이저 네이비 */
  --navy-deep:#0e2450;
  --sky:#4f93d6;         /* 일러스트 하늘색 */
  --sky-soft:#dcebf9;
  --bowtie:#d0342c;      /* 나비넥타이 레드 */
  --paper:#ffffff;
  --bg:#f2f7fd;
  --ink:#22314f;
  --ink-soft:#5f6f8f;
  --line:#d7e4f4;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:'Gowun Dodum',-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  background:var(--bg);color:var(--ink);
  min-height:100vh;
}
.wrap{max-width:640px;margin:0 auto;padding-bottom:80px}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;background:var(--navy-deep)}
.hero img{display:block;width:100%;height:auto;min-height:210px;object-fit:cover;object-position:center 30%}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,36,80,.15) 0%,rgba(14,36,80,0) 30%,rgba(14,36,80,0) 55%,rgba(14,36,80,.82) 100%)}
.hero-txt{position:absolute;left:0;right:0;bottom:0;padding:18px 20px 16px;z-index:2;color:#fff}
.hero-txt h1{font-family:'Do Hyeon',sans-serif;font-size:clamp(26px,7vw,36px);letter-spacing:.5px;line-height:1.15;text-shadow:0 2px 10px rgba(14,36,80,.6)}
.hero-txt h1 .tie{color:#ff8b84}
.hero-txt p{margin-top:5px;font-size:12.5px;opacity:.92;text-shadow:0 1px 6px rgba(14,36,80,.7)}

/* ---------- progress ---------- */
.board{background:var(--paper);border-bottom:1px solid var(--line)}
.prog{display:flex;align-items:stretch;gap:8px;padding:16px 16px 6px;max-width:640px;margin:0 auto}
.prog-main{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.prog-num{font-family:'Do Hyeon',sans-serif;font-size:34px;color:var(--navy);line-height:1}
.prog-num small{font-size:16px;color:var(--ink-soft);font-family:'Gowun Dodum',sans-serif}
.bar{margin-top:10px;height:10px;background:var(--sky-soft);border-radius:99px;position:relative;overflow:visible}
.bar-fill{height:100%;border-radius:99px;background:var(--bowtie);min-width:0;transition:width .5s cubic-bezier(.4,0,.2,1)}
.prog-sub{margin-top:9px;font-size:12px;color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:4px 12px}
.prog-sub b{color:var(--navy)}
.prog-conan{flex:0 0 84px;display:flex;align-items:flex-end;justify-content:center}
.prog-conan img{width:84px;height:auto;display:block}
.src-note{max-width:640px;margin:0 auto;padding:8px 16px 14px;font-size:11px;color:#8697b4;line-height:1.6}

/* ---------- controls ---------- */
.controls{position:sticky;top:0;z-index:20;background:rgba(242,247,253,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.controls-in{max-width:640px;margin:0 auto;padding:10px 12px 8px}
.searchrow{display:flex;gap:8px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:9px 12px}
.search svg{flex:0 0 16px;color:var(--sky)}
.search input{border:0;outline:0;background:transparent;font:inherit;font-size:14px;width:100%;color:var(--ink)}
.unwatched-btn{flex:0 0 auto;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:0 13px;font:inherit;font-size:13px;color:var(--ink-soft);cursor:pointer;transition:.15s}
.unwatched-btn.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 2px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border-radius:99px;padding:7px 14px;font:inherit;font-size:13px;cursor:pointer;border:1.5px solid var(--line);background:var(--paper);color:var(--ink-soft);transition:.15s;white-space:nowrap}
.chip .n{font-size:11px;opacity:.75;margin-left:3px}
.chip.on{color:#fff;border-color:transparent}
.chip.on[data-f="all"]{background:var(--navy)}
.chip.on[data-f="story"]{background:#1b1e27}
.chip.on[data-f="legend"]{background:var(--bowtie)}
.chip.on[data-f="unaired"]{background:var(--sky)}
.chip.on[data-f="kid"]{background:#7048b6}
.chip.on[data-f="heiji"]{background:#1f8a5c}

/* ---------- list ---------- */
.list{padding:12px 12px 0;display:flex;flex-direction:column;gap:9px}
.ep{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:12px 13px 12px 11px;display:flex;gap:11px;transition:border-color .15s, opacity .2s;position:relative}
.ep.watched{opacity:.62;border-color:#e4edf8;background:#f7fafd}
.check{flex:0 0 30px;height:30px;margin-top:2px;border-radius:50%;border:2px solid var(--sky);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;color:transparent}
.check:active{transform:scale(.88)}
.ep.watched .check{background:var(--navy);border-color:var(--navy);color:#fff}
.check svg{width:15px;height:15px}
.ep-body{flex:1;min-width:0}
.ep-top{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.ep-no{font-family:'Do Hyeon',sans-serif;font-size:15px;color:var(--navy);letter-spacing:.3px}
.ep.watched .ep-no{color:var(--ink-soft)}
.ep-title{font-size:14.5px;font-weight:700;line-height:1.35;margin-top:2px;word-break:keep-all}
.ep-kr{margin-top:4px;font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.ep-kr .kflag{display:inline-block;font-size:10.5px;color:var(--sky);border:1px solid var(--sky-soft);background:#f2f8fe;border-radius:5px;padding:1px 5px}
.ep-kr .kflag.no{color:var(--bowtie);border-color:#f6dcda;background:#fdf3f2}
.ep-note{margin-top:6px;font-size:12px;line-height:1.55;color:#6b7a97;word-break:keep-all}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}
.tag{font-size:10.5px;border-radius:6px;padding:2.5px 7px;font-weight:700;letter-spacing:.2px}
.tag.story{background:#1b1e27;color:#ffd76e}
.tag.legend{background:#fdeceb;color:var(--bowtie)}
.tag.unaired{background:#e8f2fc;color:#2d6cb0}
.tag.kid{background:#f1ebfb;color:#7048b6}
.tag.heiji{background:#e7f6ef;color:#1f8a5c}
.empty{padding:60px 20px;text-align:center;color:var(--ink-soft);font-size:14px;line-height:1.7}
.empty b{color:var(--navy)}

.foot{padding:34px 20px 10px;text-align:center;font-size:11px;color:#9aa9c4;line-height:1.8}
.save-toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,80px);background:var(--navy);color:#fff;font-size:12.5px;border-radius:99px;padding:8px 18px;box-shadow:0 6px 20px rgba(14,36,80,.3);transition:transform .3s;z-index:50;pointer-events:none}
.save-toast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

{jp:"76",t:"코난 vs 괴도키드",kr:"1기 55~56화 (Part3 3~4화)",tags:["legend","kid"],note:"코난과 키드의 역사적인 첫 만남 (1시간 SP)."},

{jp:"81–82",t:"인기 아티스트 유괴사건",kr:null,tags:["unaired"],note:"인기 아티스트 유괴 사건. 원작 15권 에피인데 더빙판에서 빠짐."},
{jp:"84–85",t:"스키 로지 살인사건",kr:"1기 62~63화 (Part3 10~11화)",tags:[],note:"란이 코난(신이치 목소리)의 도움으로 직접 추리쇼를 하는 화."},
{jp:"96",t:"궁지에 몰린 명탐정! 연속 2대 살인사건",kr:"1기 72~75화 (Part3 20~23화)",tags:["story"],note:"코난 첫 2시간 스페셜. 어설픈 명물 형사 야마무라 미사오(우수한) 첫 등장 + 코고로가 진짜로 궁지에 몰림."},
{jp:"98–99",t:"명 도예가 살인사건",kr:null,tags:["unaired"],note:"명 도예가의 가마터에서 벌어진 사건. 더빙 미방영."},

{jp:"128",t:"검은 조직 10억엔 강탈사건",kr:"2기 28화",tags:["story"],note:"이후 전개에 두고두고 이어지는 검조 필수 화."},
{jp:"129",t:"검은 조직에서 온 여자, 대학교수 살인사건",kr:"2기 29~32화",tags:["story","legend"],note:"하이바라 아이 첫 등장 (2시간 SP). 절대 건너뛰면 안 되는 화."},
{jp:"130–131",t:"경기장 무차별 협박사건",kr:"2기 33~34화",tags:[],note:"사토 미와코(신형사) 첫 등장. 야구장을 통째로 인질 잡은 협박범과의 시간 싸움."},
{jp:"132–134",t:"마술 애호가 살인사건",kr:"2기 35~37화",tags:["kid"],note:"쿠로바 카이토(고희도)가 맨얼굴로 등장하는 귀한 에피. 극장판 3기 연계."},
{jp:"136–137",t:"푸른 고성 탐색사건",kr:"2기 39~40화",tags:["legend"],note:"애니 역대 최고 시청률(23.4%) 기록. 공포 + 하이바라·미츠히코 대활약."},
{jp:"144–145",t:"우에노발 북두성 3호",kr:"2기 47~48화",tags:[],note:"유사쿠의 미발표 소설을 모방한 열차 사건."},

{jp:"150–151",t:"자동차 폭발사건의 진상",kr:"3기 1~2화 「자동차 폭발 사고의 진실」",tags:[],note:"뉴욕행 비행기 안에서 벌어지는 사건."},
{jp:"153–154",t:"소노코의 위험한 여름 이야기",kr:"3기 4~5화",tags:["story"],note:"소노코 남친이 되는 가라테 챔피언 쿄고쿠 마코토(오경구) 첫 등장. 마코소노의 시작점."},
{jp:"156–157",t:"본청 형사 사랑 이야기 2",kr:"3기 7~8화",tags:[],note:"타카기가 사토에게 다가가지 못하는 시리즈 2편. 사건보다 형사들 기류가 더 재밌음."},
{jp:"162",t:"하늘을 나는 밀실, 쿠도 신이치 최초의 사건",kr:"3기 13~14화",tags:["legend"],note:"신이치의 탐정 데뷔를 담은 화. 그저 빛 (1시간 SP)."},
{jp:"163–164",t:"달과 별과 태양의 비밀",kr:"〈자막판〉 X파일 30~31화",tags:["unaired","story"],note:"달·별·태양 암호가 핵심. 검조 떡밥이 숨어 있어 필수인데 히라가나 암호라 더빙 불가."},
{jp:"166–168",t:"톳토리 거미 저택의 괴이",kr:"〈자막판〉 X파일 32~34화",tags:["unaired","heiji"],note:"거미 저택 전설 3부작. 하인성 등장 초기 장편인데 더빙판에서 통째로 빠짐."},
{jp:"170–171",t:"어둠 속의 사각",kr:"〈자막판〉 X파일 35~36화",tags:["unaired","story"],note:"중요한 떡밥 + 신란 요소."},
{jp:"172–173",t:"소생하는 죽음의 전언",kr:"3기 37~38화",tags:[],note:"마코소노 + 신란 요소 등장."},
{jp:"174",t:"20년째의 살의, 심포니호 연속 살인사건",kr:"〈자막판〉 X파일 39~42화 (2시간 SP)",tags:["unaired","legend","heiji"],note:"2시간 스페셜. 스토리·작화 모두 오지는 레전드 화 + 하인성."},
{jp:"176–178",t:"검은 조직과의 재회",kr:"3기 18~20화",tags:["story","legend"],note:"진과의 재대결. 하이바라 편 초반의 핵심."},

{jp:"188–193",t:"목숨을 건 부활",kr:"3기 30~35화",tags:["story","legend","heiji"],note:"정체를 지키기 위해 목숨 걸고 신이치로 돌아오는 화. 하인성×하이바라 첫 만남. 전설 그 자체."},
{jp:"194–195",t:"의미깊은 오르골",kr:"〈자막판〉 X파일 44~45화",tags:["unaired"],note:"오르골에 숨은 암호를 쫓는 화. 극초반 에피와 이어져서 정주행할 때 더 맛있음."},
{jp:"199–200",t:"용의자는 모리 코고로",kr:"3기 39~40화",tags:[],note:"코고로가 살인 용의자로 몰리는 화. 코난이 아저씨를 필사적으로 변호함."},
{jp:"205–206",t:"본청 형사 사랑 이야기 3",kr:"〈자막판〉 X파일 46~47화",tags:["unaired"],note:"타카기·사토 시리즈 3편. 경쟁자 등장으로 타카기 마음이 본격적으로 흔들림."},
{jp:"212–213",t:"버섯과 곰과 탐정단",kr:"3기 48~49화",tags:[],note:"버섯 따러 갔다가 사건에 휘말리는 소년탐정단. 아이들 천진함과 사건의 온도차가 재밌음."},
{jp:"217–218",t:"봉인된 메구레의 비밀",kr:"4기 1~2화",tags:[],note:"메구레(골롬보) 반장이 늘 모자를 쓰는 이유가 밝혀지는 화."},

{jp:"220–221",t:"거짓말투성이의 의뢰인",kr:"4기 3~4화",tags:["heiji"],note:"하인성 어머니 첫 등장."},

{jp:"230–231",t:"수수께끼의 승객",kr:"4기 17~18화",tags:["story","legend"],note:"한 버스에 전·현직 검조 관계자가 3명. 코하의 바이블로도 불림."},

{jp:"264–265",t:"법정의 대결, 키사키 vs 코고로",kr:"4기 49~50화",tags:[],note:"엄마 키사키 변호사 vs 아빠 코고로의 법정 대결."},
{jp:"266–268",t:"발렌타인의 진실",kr:"4기 46~48화",tags:[],note:"신란ㅠㅠ 로 요약되는 화."},
{jp:"269–270",t:"범죄의 잃어버린 유품",kr:"4기 51~52화",tags:["story"],note:"중요한 떡밥 + 신란 요소."},
{jp:"271–272",t:"숨기고 서둘러 생략",kr:"〈자막판〉 X파일2 9~10화",tags:["story","unaired"],note:"다잉 메시지의 생략된 부분을 읽어내는 화. 언어유희가 핵심이라 더빙 불가."},
{jp:"277–278",t:"영어교사 vs 서쪽의 명탐정",kr:"5기 4~5화",tags:["story","heiji"],note:"조디 선생님과 하인성의 첫 만남. 중요한 떡밥."},

{jp:"284–285",t:"차이나타운, 비의 데자뷰",kr:"5기 11~12화",tags:[],note:"뉴욕 편으로 이어지는 화. 전설의 '보쿠 카레라이스!'"},
{jp:"286–288",t:"쿠도 신이치 뉴욕의 사건",kr:"5기 13~15화",tags:["story","legend"],note:"베르무트·아카이로 이어지는 초대형 떡밥. '사람을 구하는 데 이유가 필요해?'"},
{jp:"289–290",t:"숲을 헤매는 미츠히코",kr:"5기 16~17화",tags:[],note:"막판에 동심을 불러일으키는 화."},
{jp:"294–295",t:"사랑과 결단의 스매쉬",kr:"애니박스 X파일 2기 15~16화 (투니버스 더빙 없음)",tags:["unaired"],note:"란이 납치당하는 에피."},
{jp:"301–302",t:"악의와 성자의 행진",kr:"5기 23~24화",tags:[],note:"타카기·사토가 얽히는 본청 형사 계열. 시리즈 따라간다면 빼놓기 아까움."},
{jp:"304",t:"흔들리는 경시청, 1200만 명의 인질",kr:"5기 26~29화 (Part2 1~4화)",tags:["legend"],note:"마츠다 진페이 등장 + 화룡점정 신란. 개쌉레전드 스페셜."},
{jp:"307–308",t:"남겨진 소리 없는 증언",kr:"〈자막판〉 X파일2 17~18화",tags:["story","unaired"],note:"말 못 하는 증인이 남긴 단서를 읽어내는 화. 바로 뒤 '검은 조직과의 접촉'으로 직결."},
{jp:"309–311",t:"검은 조직과의 접촉",kr:"5기 32~34화 (Part2 7~9화)",tags:["story"],note:"이타쿠라 소프트 등 떡밥이 쏟아지는 검조 필수 화."},
{jp:"312–313",t:"석양에 물든 히나 인형",kr:"〈자막판〉 X파일2 19~20화",tags:["story","unaired"],note:"히나 인형에 얽힌 오래된 사연. 막판 아유미의 한마디가 백미."},
{jp:"321–322",t:"사라진 유괴 도주차",kr:"5기 42~43화",tags:[],note:"코난이 유괴당하는 에피."},
{jp:"325–327",t:"불꽃 속의 붉은 말",kr:"5기 44~46화 「화염 속의 붉은 말」",tags:["heiji"],note:"신이치 미등장인데도 신이치 목소리가 계속 나오는 화."},
{jp:"329–330",t:"돈으로 살 수 없는 우정",kr:"5기 48~49화 (Part2 23~24화)",tags:["story"],note:"돈 때문에 갈라진 옛 친구들. 제목 그대로 우정의 값을 묻는 화."},
{jp:"331–332",t:"의혹의 매운 카레",kr:"5기 50~51화",tags:[],note:"질투하는 코난이 내내 귀여운 화."},
{jp:"335–336",t:"토도 현상소의 비밀",kr:"6기 3~4화",tags:["story"],note:"중요한 떡밥 + 코하 요소."},
{jp:"338–339",t:"4대의 포르쉐",kr:"6기 5~6화",tags:["story"],note:"똑같은 포르쉐 네 대가 얽힌 사건. 차의 미세한 차이가 결정적 단서."},
{jp:"340–341",t:"화장실에 숨긴 비밀",kr:"6기 7~8화",tags:["story"],note:"화장실에 숨긴 물건 하나로 사건 전체가 뒤집힘. 소소해 보여도 스토리상 중요."},
{jp:"343–344",t:"편의점의 함정",kr:"6기 9~10화",tags:["story"],note:"중요한 떡밥 + 란이 신이치에게 전화 거는 이야기."},

{jp:"671–674",t:"탐정들의 야상곡",kr:"〈자막판〉 X파일3 18~21화",tags:["story","unaired"],note:"아무로(버번) 관련 떡밥 에피."},
{jp:"675–676",t:"1mm도 용서하지 않아",kr:"12기 6~8화",tags:["story"],note:"제목 그대로 1mm의 오차가 사건을 뒤집음. 정밀한 물리 트릭이 핵심."},
{jp:"681–683",t:"목숨을 건 연애 중계",kr:"〈자막판〉 X파일3 24~26화",tags:["story","unaired"],note:"중계 개시/절체절명/현장 돌입 3부작. 생중계 도중 인질극이 터지는 긴박한 장편. 더빙 미방영."},
{jp:"684–685",t:"거품과 김과 연기",kr:"〈자막판〉 X파일3 27~28화",tags:["story","unaired"],note:"거품·김·연기처럼 사라지는 것들이 단서. 더빙 미방영."},
{jp:"690–691",t:"쿠도 유사쿠의 미해결사건",kr:"〈자막판〉 X파일3 29~30화",tags:["story","unaired"],note:"쿠도 유사쿠의 콜드 케이스."},
{jp:"699–700",t:"하이바라의 비밀에 다가오는 그림자",kr:"12기 23~24화",tags:["story"],note:"하이바라에게 드리우는 그림자. 미스터리 트레인의 전편."},
{jp:"701–704",t:"칠흑의 미스터리 트레인",kr:"12기 25~28화",tags:["story","legend","kid"],note:"베르무트·버번·세라 총출동 + 704화에 키드까지. 검조 편 필수."},
{jp:"705",t:"밀실 속에 있는 코난",kr:"12기 29화",tags:["story"],note:"미스터리 트레인 직후 이어지는 화."},
{jp:"706",t:"수수께끼를 푸는 버본",kr:"12기 30화",tags:["story"],note:"버본(아무로) 관련 필수 화."},
{jp:"712–715",t:"핫토리 헤이지와 흡혈귀 저택",kr:"13기 1~3화",tags:["heiji"],note:"흡혈귀 전설이 얽힌 저택 4부작. 헤카 팬이라면 놓칠 수 없는 장편."},
{jp:"722–723",t:"달고 차가운 배달물",kr:"13기 7~8화",tags:[],note:"배달된 아이스크림 하나가 실마리. 부담 없이 가볍게 보기 좋음."},
{jp:"724–725",t:"괴도키드와 붉은 얼굴의 인어",kr:"13기 9~10화",tags:["kid"],note:"미스터리 트레인에서 못 훔친 보석을 노리는 키드."},
{jp:"731–732",t:"현장의 이웃은 전남친",kr:"〈자막판〉 X파일3 39~40화",tags:["story","unaired"],note:"사건 현장 옆집에 피해자의 전남친이 살고 있었다는 화. 관계도가 꼬일수록 재밌어짐."},
{jp:"734",t:"조디의 추억과 꽃구경의 함정",kr:"〈자막판〉 X파일3 41~42화 (1시간 SP)",tags:["story","unaired"],note:"조디 선생님의 과거가 나오는 화 (1시간 SP)."},
{jp:"738–739",t:"코고로는 bar에 있다",kr:"〈자막판〉 X파일3 43~44화",tags:["story","unaired"],note:"코고로가 단골 바에서 사건에 휘말림. 어른들 무대라 평소와 결이 다름."},
{jp:"740–741",t:"란도 쓰러진 욕실",kr:"13기 19~20화",tags:["story"],note:"란까지 쓰러지는 욕실 사고. 코난이 진심으로 다급해지는 화."},
{jp:"744–745",t:"용의자 쿄고쿠 마코토",kr:"13기 22~23화",tags:["story"],note:"쿄고쿠 마코토(오경구)가 용의자가 되는 화."},
{jp:"746–747",t:"괴도키드 vs 쿄고쿠 마코토",kr:"14기 1~2화",tags:["kid"],note:"키드×쿄고쿠(오경구) 대결 구도의 시작. 극장판 감청의 권의 원형."},
{jp:"751–752",t:"행운을 부르는 삼색털고양이 사건",kr:"14기 6~7화",tags:[],note:"행운을 부른다는 삼색털 고양이를 둘러싼 사건. 고양이가 사실상 목격자."},
{jp:"754–756",t:"붉은 여자의 참극",kr:"14기 9~11화",tags:["story"],note:"수증기/악령/복수 3부작. '붉은 여자' 괴담이 실제 사건으로 번짐."},
{jp:"759–760",t:"뜻밖의 결말을 맞이하는 연애소설",kr:"14기 14~15화",tags:["story"],note:"연애소설의 결말이 현실 사건과 겹쳐짐. 작중작을 쓴 구성이 깔끔."},
{jp:"763–764",t:"코난과 헤이지, 사랑의 암호",kr:"〈자막판〉 미공개사건4 3~4화",tags:["heiji","unaired"],note:"하인성이 두고두고 놀림받는 '그 발언'이 나오는 헤카 레전드."},
{jp:"770–771",t:"어색한 다과회",kr:"14기 20~21화",tags:["story"],note:"묘하게 어색한 다과회. 대화 속 위화감이 그대로 단서가 됨."},
{jp:"772–773",t:"쿠도 신이치 수족관 사건",kr:"14기 22~23화",tags:["kid"],note:"신이치 등장 + 쿠로바 카이토와의 만남. 신란이 흘러넘침."},
{jp:"774",t:"사라진 뭉크의 절규",kr:"14기 24화",tags:[],note:"살인 없이 밥 먹으면서 보기 좋은 화."},
{jp:"779–783",t:"비색 시리즈",kr:"14기 27~31화",tags:["story"],note:"서막/추구/교차/귀환/진상 5부작. 아카이 슈이치의 정체 문제가 크게 움직이는 3분기의 결말."},
{jp:"785–786",t:"타이코, 사랑이 걸린 명인전",kr:"15기 31~32화",tags:["story"],note:"장기 명인전 무대. 한 수 한 수가 그대로 단서가 되는 구성."},
{jp:"787–788",t:"한여름의 수영장에 잠긴 수수께끼",kr:"15기 1~2화",tags:["story"],note:"한여름 수영장에서 벌어진 사건. 물속이라는 무대를 이용한 트릭이 핵심."},
{jp:"792–793",t:"3명의 제1목격자",kr:"〈자막판〉 미공개사건4 9~10화",tags:["story","unaired"],note:"최초 목격자가 셋이나 되는 기묘한 사건. 진술이 엇갈리는 구조가 재밌는데 더빙 미방영."},
{jp:"804–805",t:"코난과 에비조, 가부키 18번 미스터리",kr:"〈자막판〉 미공개사건4 13~14화",tags:["unaired"],note:"성인 남성들과 케미가 오지는 코난."},
{jp:"808–809",t:"카마이타치의 여관",kr:"15기 16~17화",tags:["heiji"],note:"낫족제비(카마이타치) 전설이 도는 여관. 하인성 등장."},
{jp:"810–812",t:"나가노 현경의 검은 어둠",kr:"〈자막판〉 미공개사건4 17~19화",tags:["unaired"],note:"야마토 칸스케·우에하라 유이·모로후시 타카아키 나가노 3인방 총출동 3부작. 이들 과거가 크게 다뤄지는데 더빙 미방영."},
{jp:"813",t:"아무로에게 살며시 다가오는 그림자",kr:"15기 18화 「안기준에게 다가오는 그림자」",tags:[],note:"아무로 샌드위치 레시피가 궁금하면 볼 것."},
{jp:"824",t:"소년탐정단의 비 피하기",kr:"15기 29화",tags:[],note:"손꼽히는 망작(?)으로 유명한 오리지널. 웃음이 필요하면 한 번."},
{jp:"827–828",t:"죽을 만큼 맛있는 라면 2",kr:"16기 2~3화",tags:["story"],note:"전설의 라면집을 다시 찾아가는 속편. 먹방 반 사건 반."},
{jp:"830–832",t:"좀비가 둘러싼 별장",kr:"16기 5~7화",tags:["heiji"],note:"믿보핫 에피."},
{jp:"836–837",t:"사이가 나쁜 걸즈밴드",kr:"16기 11~12화",tags:["story"],note:"사이 험악한 걸즈밴드 멤버들 사이에서 벌어진 사건. 인간관계가 그대로 용의선상."},
{jp:"843–844",t:"탐정단은 의견 불일치",kr:"16기 18~19화",tags:["story"],note:"끝부분만 봐도 무관하다고 안내된 화."},
{jp:"845–846",t:"절체절명! 어둠 속의 코난",kr:"16기 20~21화",tags:[],note:"범인이 진심으로 코난을 노리는 오리지널 에피."},
{jp:"847–848",t:"치바의 UFO 난사건",kr:"16기 22~23화",tags:[],note:"치바 형사가 UFO 소동에 휘말림. 평소 조연인 치바가 주인공처럼 활약."},
{jp:"849–850",t:"혼인신고서의 패스워드",kr:"16기 24~25화",tags:["story"],note:"혼인신고서에 걸린 패스워드를 푸는 화. 타카기·사토 서사와 이어짐."},
{jp:"853–854",t:"벚꽃반의 추억",kr:"16기 28~29화",tags:[],note:"란 GIRL / 신이치 BOY 편. 중학 시절 벚꽃반 이야기."},
{jp:"861–862",t:"17년 전과 같은 현장",kr:"16기 36~37화",tags:["story"],note:"17년 전 사건과 똑같은 현장이 재현됨. 4분기의 발단."},
{jp:"863–864",t:"영혼탐정 살해사건",kr:"16기 38~39화",tags:["story"],note:"영혼을 본다는 '영혼탐정'이 살해당함. 앞 화와 이어지며 조직 쪽으로 흘러감."},
{jp:"866–867",t:"배신의 스테이지",kr:"17기 2~3화",tags:["story"],note:"무대 위에서 벌어진 배신극. 공연이라는 장치를 그대로 트릭에 써먹음."},
{jp:"872–874",t:"코난과 헤이지의 누에 전설",kr:"17기 8~10화",tags:["heiji"],note:"울음소리/손톱자국/해결 3부작. 요괴 '누에' 전설을 하인성과 쫓음. 해결편 끝부분에 새 인물 등장하니 꼭 끝까지."},
{jp:"878–879",t:"탈의실의 사각",kr:"17기 14~15화",tags:["story"],note:"탈의실이라는 닫힌 공간의 사각을 파고듦. 공간 트릭이 깔끔."},
{jp:"881–882",t:"잔물결의 마법사",kr:"17기 17~18화",tags:["story"],note:"아카이 패밀리와 신이치·란의 첫 만남을 회상하는 화."},
{jp:"885–886",t:"수수께끼 풀이는 찻집 포와로에서",kr:"17기 21~22화",tags:["story","heiji"],note:"하인성과 아무로가 처음 만나는 화."},
{jp:"887–888",t:"괴도키드의 기계장치 상자",kr:"17기 23~24화",tags:["kid"],note:"키드와 오키야 스바루의 첫 대면. 음성변조기 사진 소동."},
{jp:"889–890",t:"신임 교사와 해골 사건",kr:"17기 25~26화",tags:["story"],note:"신임 교사가 부임한 학교에서 해골이 발견되며 시작."},
{jp:"894–895",t:"이웃집 일식 요리사의 추리쇼",kr:"17기 28~29화",tags:["story"],note:"옆 가게 일식 요리사가 추리쇼를 벌임. 코고로 아닌 사람이 추리를 맡는 구성이 신선."},
{jp:"896–897",t:"하얀 손의 여자",kr:"17기 30~31화",tags:["story"],note:"'하얀 손의 여자'라는 목격담에서 출발. 조직 쪽 이야기와도 맞물림."},
{jp:"909–910",t:"불타는 텐트의 괴이",kr:"18기 6~7화",tags:["story"],note:"와카사 루미×쿠로다의 미묘한 관계가 드러나는 화. 더빙 미방영."},
{jp:"913–914",t:"끌려간 코난",kr:"18기 10~11화 「납치된 코난」",tags:[],note:"또(!) 유괴당하는 코난. 오리지널 에피."},
{jp:"916–917",t:"사랑과 추리 검도대회",kr:"18기 13~14화",tags:["story"],note:"검도대회 무대. 란의 실력과 사건이 나란히 굴러감."},
{jp:"919–920",t:"여고생 트리오 비밀의 카페",kr:"18기 16~17화",tags:["story"],note:"여고생 셋이 드나들던 비밀스러운 카페에서 벌어지는 사건."},
{jp:"925–926",t:"마음이 담긴 스트랩",kr:"18기 19~20화",tags:["story"],note:"휴대폰 스트랩 하나에 담긴 마음을 되짚는 화. 바로 다음이 「진홍의 수학여행」이라 이어서 볼 것."},
{jp:"927–928",t:"진홍의 수학여행",kr:"18기 31~34화 (극장 상영판 선홍편·연홍편)",tags:["story","legend","heiji","kid"],note:"드디어 주인공 커플이 정식으로 사귀게 되는 화. 하인성은 신이치 대역, 키드는 애니 오리지널 연출로 등장."},
{jp:"941–942",t:"마리아를 찾아라!",kr:"19기 6~7화",tags:["story"],note:"'마리아'라는 단서를 쫓는 화. 4분기의 위기."},
{jp:"952–954",t:"미궁 칵테일",kr:"19기 17~19화 (자막 방영, 더빙은 「미궁 칵테일 스페셜」 별도)",tags:["story"],note:"칵테일 이름이 그대로 암호가 되는 3부작. 티빙은 자막판, 더빙은 「미궁 칵테일 스페셜」로 따로 편성."},
{jp:"965–968",t:"대괴수 고메라 vs 가면 야이바",kr:"스페셜 「대괴수 고메라 VS 가면 사나이」 (티빙 자막)",tags:["heiji"],note:"작중 특촬물 고메라와 가면 야이바가 맞붙는 오리지널 4부작. 하인성·서가영도 나와서 축제 분위기."},
{jp:"971–974",t:"표적은 경시청 교통부",kr:"20기 1~4화",tags:["story"],note:"미이케 나에코의 상사가 살해되며 시작되는 4부작. 극장판 「제로의 집행인」이 던진 떡밥이 여기서 회수됨."},
{jp:"983–984",t:"괴도키드 vs 공명, 표적이 된 입술",kr:"20기 13~14화",tags:["story","kid","heiji"],note:"키드+하인성+나가노 총출동. 카즈하로 변장한 키드가 하인성에게 입술을 빼앗길 뻔한 그 화."},
{jp:"993–995",t:"대역은 쿄고쿠 마코토",kr:"20기 23~25화",tags:["story"],note:"쿄고쿠 마코토가 대역을 맡으며 벌어지는 3부작. 하이바라 부모가 시로하토 제약 소속이었다는 이야기가 나와 「비색의 탄환」과 연결."},
{jp:"1003–1005",t:"36칸의 퍼펙트 게임",kr:"20기 31~33화",tags:["story"],note:"원작 97권에 '36칸의 완전 범죄'로 실린 3부작. 승부의 판 위에서 오가는 수가 그대로 트릭."},
{jp:"1011–1012",t:"산나물 채집과 클로버",kr:"21기 5~6화",tags:["story"],note:"산나물 캐러 간 소년탐정단이 사건에 휘말림. 네잎클로버가 결정적 단서."},
{jp:"1018–1020",t:"골동품 쟁반은 감출 수 없다",kr:"21기 12~14화",tags:["story"],note:"값나가는 골동품 쟁반을 둘러싼 3부작. 물건 하나의 행방이 사건 전체를 끌고 감."},
{jp:"1024–1025",t:"오오카 모미지의 도전장",kr:"21기 18~19화",tags:["story"],note:"카즈하의 라이벌 오오카 모미지가 하인성에게 도전장을 던짐. 헤카 팬은 속 타는 화."},

{jp:"1098–1099",t:"바람의 여신, 하기와라 치하야",kr:"23기 27~28화",tags:["story"],note:"가나가와 교통기동대 소대장 하기와라 치하야 첫 등장. 납치당한 아가사 박사를 코난이 스케이트보드로 쫓는 추격전."},
{jp:"1105–1106",t:"키드 vs 아무로, 퀸스 뱅",kr:"23기 33~34화",tags:["kid"],note:"키드×아무로의 본격 대결."},
{jp:"1109–1110",t:"다카기와 다테의 수첩 약속",kr:"23기 37~38화",tags:["story"],note:"다카기와 다테의 약속이 밝혀지는 화."},

{jp:"1135–1136",t:"오오카 모미지의 달콤한 함정",kr:"24기 8~9화",tags:["story"],note:"오오카 모미지가 하인성 주변에 놓는 '달콤한 함정'. 카즈하와의 신경전 계속."},
{jp:"1144–1145",t:"호텔 연속 폭파 사건",kr:"24기 17~18화",tags:["story"],note:"호텔에서 연쇄 폭발이 일어남. 시간에 쫓기는 전개가 긴박."},
{jp:"1148–1149",t:"탐정단과 두 명의 인솔자",kr:"24기 21~22화",tags:["story"],note:"소년탐정단이 낯선 인솔자 두 명과 움직이게 되는 사건."},
{jp:"1150–1151",t:"괴도키드와 왕관 매직",kr:"24기 23~24화",tags:["story","kid"],note:"아즈사로 변장한 키드. 아무로와의 2차전."},

{jp:"1169–1170",t:"식인교실의 괴이",kr:"시즌 2025 (자막)",tags:["story"],note:"'사람을 잡아먹는 교실'이라는 괴담을 파헤치는 화. 5분기 초반 중요편."},
{jp:"1171–1172",t:"집사가 된 이유",kr:"시즌 2025 (자막)",tags:["story"],note:"한 집사가 그 집에서 일하게 된 이유를 되짚는 사건."},
{jp:"1184–1185",t:"아카렌가 창고와 사라진 납치범",kr:"시즌 2025 32~33화",tags:["story"],note:"붉은 벽돌 창고에서 납치범이 감쪽같이 사라짐."},
{jp:"1187",t:"에피소드 「ZERO」 쿠도 신이치 수족관 사건",kr:"한국판 1205~1206화 (시즌 2025 마지막)",tags:["kid"],note:"772~773화 수족관 사건을 신작화로 리메이크한 화. 쿠로바 카이토 등장."},
{jp:"1193–1194",t:"키드 vs 하쿠바, 청색의 옥좌",kr:"시즌 2026 6~7화",tags:["kid"],note:"신이치로 변장한 키드 + 약 17년 만에 하쿠바 사구루 재등장."},
{jp:"1204–1205",t:"코난과 아즈사를 유괴한 건 누구?",kr:"시즌 2026 18~19화",tags:["story"],note:"코난과 카페 포와로 점원 아즈사가 함께 납치되는 사건. 최신 시즌 중요편."}
];

const TAG_LABEL={story:"🖤 스토리 필수",legend:"⭐ 레전드",unaired:"🇯🇵 더빙없음·자막판",kid:"키드",heiji:"하인성"};
const STORE_KEY='conan-watched-v1';
let watched={};
let filter='all', onlyUnwatched=false, query='';

const $=s=>document.querySelector(s);
const list=$('#list'), empty=$('#empty'), toast=$('#toast');
let toastTimer=null;

function epId(e){return 'ep'+e.jp.replace(/[^0-9]/g,'-');}

function render(){
  const q=query.trim().toLowerCase();
  const filtered=EPS.filter(e=>{
    if(filter!=='all' && !e.tags.includes(filter)) return false;
    if(onlyUnwatched && watched[epId(e)]) return false;
    if(q && !(e.t.toLowerCase().includes(q)||e.jp.includes(q)||(e.kr||'').toLowerCase().includes(q)||e.note.toLowerCase().includes(q))) return false;
    return true;
  });
  list.innerHTML=filtered.map(e=>{
    const id=epId(e), done=!!watched[id];
    const krHtml = e.kr===null
      ? `<span class="kflag no">국내 미방영</span><span>일본판에서만 볼 수 있어요</span>`
      : `<span class="kflag">한국판</span><span>${e.kr}</span>`;
    return `<article class="ep ${done?'watched':''}" data-id="${id}">
      <button class="check" aria-label="시청 체크" aria-pressed="${done}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9.5 18 20 6.5"/></svg>
      </button>
      <div class="ep-body">
        <div class="ep-top"><span class="ep-no">${e.jp}화</span></div>
        <div class="ep-title">${e.t}</div>
        <div class="ep-kr">${krHtml}</div>
        <p class="ep-note">${e.note}</p>
        <div class="tags">${e.tags.map(t=>`<span class="tag ${t}">${TAG_LABEL[t]}</span>`).join('')}</div>
      </div>
    </article>`;
  }).join('');
  empty.style.display=filtered.length?'none':'block';
  if(!filtered.length){
    empty.innerHTML = onlyUnwatched&&!q ? '이 카테고리는 <b>전부 시청 완료</b>!<br>대단해요 🎉' : '조건에 맞는 에피소드가 없어요.<br>검색어나 필터를 바꿔보세요.';
  }
  updateStats();
}

function updateStats(){
  const total=EPS.length;
  const done=EPS.filter(e=>watched[epId(e)]).length;
  $('#watchedCount').textContent=done;
  $('#totalCount').textContent=total;
  const pct=total?Math.round(done/total*100):0;
  const fill=$('#barFill');
  fill.style.width=pct+'%';
  fill.classList.toggle('zero',done===0);
  const cats=['story','legend','unaired','kid','heiji'];
  $('#progSub').innerHTML=cats.map(c=>{
    const all=EPS.filter(e=>e.tags.includes(c));
    const d=all.filter(e=>watched[epId(e)]).length;
    return `<span>${TAG_LABEL[c]} <b>${d}/${all.length}</b></span>`;
  }).join('');
  document.querySelectorAll('.chip').forEach(ch=>{
    const f=ch.dataset.f;
    const n=f==='all'?EPS.length:EPS.filter(e=>e.tags.includes(f)).length;
    ch.querySelector('.n').textContent=n;
  });
}

/* 저장소: Claude 아티팩트에서는 window.storage, 그 외(깃허브 페이지 등)에서는 localStorage */
const STORE = (typeof window!=='undefined' && window.storage && typeof window.storage.get==='function')
  ? { async get(k){ return await window.storage.get(k); },
      async set(k,v){ return await window.storage.set(k,v); } }
  : { async get(k){ const v=localStorage.getItem(k); return v===null?null:{key:k,value:v}; },
      async set(k,v){ localStorage.setItem(k,v); return {key:k,value:v}; } };

async function load(){
  try{
    const r=await STORE.get(STORE_KEY);
    if(r&&r.value) watched=JSON.parse(r.value)||{};
  }catch(e){ watched={}; }
  render();
}
let saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{
      await STORE.set(STORE_KEY, JSON.stringify(watched));
      toast.textContent='저장했어요';
    }catch(e){
      toast.textContent='저장에 실패했어요. 브라우저의 사이트 데이터 설정을 확인해 주세요';
    }
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>toast.classList.remove('show'),1400);
  },350);
}

list.addEventListener('click',ev=>{
  const btn=ev.target.closest('.check'); if(!btn) return;
  const card=btn.closest('.ep'); const id=card.dataset.id;
  if(watched[id]) delete watched[id]; else watched[id]=true;
  card.classList.toggle('watched',!!watched[id]);
  btn.setAttribute('aria-pressed',!!watched[id]);
  if(onlyUnwatched&&watched[id]){ setTimeout(render,220); } else { updateStats(); }
  save();
});
$('#chips').addEventListener('click',ev=>{
  const ch=ev.target.closest('.chip'); if(!ch) return;
  filter=ch.dataset.f;
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===ch));
  render();
});
$('#unwatchedBtn').addEventListener('click',()=>{
  onlyUnwatched=!onlyUnwatched;
  $('#unwatchedBtn').classList.toggle('on',onlyUnwatched);
  render();
});
$('#searchInput').addEventListener('input',ev=>{ query=ev.target.value; render(); });

render();
load();
</script>
</body>
</html>
